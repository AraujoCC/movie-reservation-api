# ── H2 in-memory database ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:moviedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate auto-create schema from entities ──────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ── Flyway desabilitado (H2 nao roda migrations Postgres) ─────────────────────
spring.flyway.enabled=false

# ── MongoDB e Kafka — desabilitados ──────────────────────────────────────────
app.kafka.enabled=false
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

